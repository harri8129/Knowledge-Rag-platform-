server {
    listen 80;
    server_name _;  # Replace with your domain name if available, e.g., yourdomain.com

    client_max_body_size 50M;

    # 1. Django static assets (Admin panel & Swagger docs)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Django API and Admin requests routed to Gunicorn
    location ~ ^/(api|admin)/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for heavy ingestion/chunking
        proxy_connect_timeout 90s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 3. React Frontend (Single Page Application)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}